no_go:
  topics:
    - Политика и выборы — любые стороны
    - Военная тематика и конфликты
    - Религиозные споры
    - Уголовные дела и судебные разбирательства без прямой связи с брендом
    - Медицинские и фармацевтические темы (кроме HR/wellbeing в образовании)
    - Личная жизнь публичных людей без их согласия
    - Критика конкурентов — только нейтральные сравнения фактов
    - Мошеннические схемы и серые финансовые инструменты

  tonal_flags:
    - Сарказм и ирония по острым социальным темам
    - Хайп на трагедиях и катастрофах
    - Инфоповоды, где бренд выглядит оппортунистом

  escalate_to_operator:
    - Тема из no-go, но кажется значимой для бренда
    - Зерокодер упоминается в негативном контексте
    - Инцидент с участием фонда или его партнёров (Солонин, Мацкевич)
